name: Deploy to GitHub Pages

# After the full CI workflow succeeds on main, build the Vite app and publish the
# triggering commit's dist/ to the gh-pages branch. A separate push-triggered
# deploy used to race CI and could publish while the server suite was red.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # A completed-but-failed/cancelled CI run still triggers workflow_run; only a
    # successful full client + server run may reach production.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not a newer moving main.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      # Refuse to publish a client whose raid ruleset the LIVE Worker doesn't serve yet.
      #
      # /raid/start rejects a version mismatch with 426 stale_ruleset, so shipping the
      # client first makes every invasion fail until someone remembers to deploy the
      # Worker (which is a manual workflow_dispatch). This turns "remember the order"
      # into an enforced gate. The client handles the mismatch gracefully with a reload
      # prompt, so this is defence in depth, not the only protection.
      #
      # Deliberately non-fatal if the Worker is unreachable: a health-check blip should
      # not block a docs or art deploy. Only a definite, parsed mismatch fails.
      - name: Check live Worker raid ruleset
        run: |
          API_URL=$(grep -E '^VITE_API_URL=' .env.production | cut -d= -f2- | tr -d '"' | tr -d "'")
          CLIENT=$(grep -oE 'RAID_RULESET_VERSION = [0-9]+' src/raid/replay.ts | grep -oE '[0-9]+')
          echo "client raid ruleset: $CLIENT"
          if [ -z "$API_URL" ]; then
            echo "::notice::No VITE_API_URL configured — offline-only build, skipping check."
            exit 0
          fi
          # Cache-buster: immediately after a Worker deploy the plain "/" response can
          # briefly still be the previous body (observed in practice), which would fail
          # this gate spuriously right when you have just done the correct thing.
          BODY=$(curl -fsS --max-time 10 "$API_URL/?ci=$GITHUB_RUN_ID" || true)
          if [ -z "$BODY" ]; then
            # Genuinely unreachable (outage, DNS, timeout). Don't block an art/docs deploy
            # on a health blip — the client's own reload prompt still covers the player.
            echo "::warning::$API_URL unreachable — skipping the ruleset gate."
            exit 0
          fi
          LIVE=$(echo "$BODY" | grep -oE '"raidRulesetVersion":[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$LIVE" ]; then
            # Reachable but the field is absent: that Worker predates this check, which is
            # itself proof it is behind. Distinct from unreachable, and it must fail.
            echo "::error::The live Worker does not report raidRulesetVersion, so it predates this build."
            echo "Deploy the Worker first, then re-run this deploy."
            exit 1
          fi
          echo "live Worker raid ruleset: $LIVE"
          if [ "$CLIENT" != "$LIVE" ]; then
            echo "::error::Client ships raid ruleset $CLIENT but the live Worker serves $LIVE."
            echo "Deploy the Worker first (Actions -> 'Deploy server (Cloudflare Worker)'),"
            echo "applying any pending D1 migrations, then re-run this deploy."
            exit 1
          fi
      # Online-layer config (VITE_API_URL / VITE_GOOGLE_CLIENT_ID) comes from the
      # committed .env.production — both values are public. Nothing to inject here.
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
